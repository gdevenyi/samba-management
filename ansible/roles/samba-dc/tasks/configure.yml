# configure.yml - Orchestrate the post-provisioning DC configuration.
#
# Each phase lives in a focused file so this orchestrator stays scannable:
#   smb-time-dns.yml   - smb.conf + time sync + Samba DNS resolver
#   dns-self-heal.yml  - re-point the DC's own A records at its current address
#   reverse-dns.yml    - reverse DNS zone + PTR for the DC
#   scripts.yml        - /opt/samba-management deploy + sbin symlinks
#
# NOTE: ous-shares-nfs.yml (OUs, share dirs, NFS) is intentionally NOT here.
# It chowns share directories to the AD "domain users" group, which only
# resolves through NSS once SSSD is up, so main.yml runs it after sssd.yml.
---
- name: Core services - smb.conf, time, DNS resolver, start samba-ad-dc
  ansible.builtin.import_tasks: smb-time-dns.yml

# Runs before reverse-dns.yml so the forward record is correct first, and
# after smb-time-dns.yml because `samba-tool dns` needs samba-ad-dc listening.
- name: Re-point the DC's own DNS records at its current address
  ansible.builtin.include_tasks: dns-self-heal.yml
  when:
    - samba_dns_self_heal | bool
    - _samba_domain_exists | default(false)

- name: Reverse DNS zone and PTR record
  ansible.builtin.import_tasks: reverse-dns.yml

- name: Deploy management scripts and create symlinks
  ansible.builtin.import_tasks: scripts.yml
