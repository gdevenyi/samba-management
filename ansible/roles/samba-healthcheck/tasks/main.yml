# samba-healthcheck tasks - Non-destructive verification of domain health.
#
# Checks DNS SRV records, Kerberos tickets, SSSD/Winbind/Autofs services,
# NSS user/group resolution, DC network connectivity, and active NFS mounts.
# All checks use ignore_errors: true so the full summary is always printed
# even when individual checks fail.
---
# --- DNS checks ---
# SRV records are the primary service discovery mechanism in AD.  Without
# them, clients cannot locate domain controllers automatically.
# DNS tasks must not fail the play -- the summary task below renders the
# pass/fail matrix and that should always run, even when individual checks
# detect a problem.
- name: Check DNS SRV _ldap._tcp
  ansible.builtin.command: "host -t SRV _ldap._tcp.{{ healthcheck_realm | lower }}"
  register: dns_ldap
  changed_when: false
  failed_when: false

- name: Check DNS SRV _kerberos._tcp
  ansible.builtin.command: "host -t SRV _kerberos._tcp.{{ healthcheck_realm | lower }}"
  register: dns_krb
  changed_when: false
  failed_when: false

# Resolve which host the rest of the checks should actually probe.
#
# An explicit healthcheck_dc_hostname always wins.  Otherwise take the target
# out of the _ldap._tcp SRV answer we just made -- that is the DC the domain
# itself advertises, and it is correct on every host class without any
# per-site variable.
#
# The previous fallback was the host's OWN hostname, which is right only on the
# DC.  On a member whose site name differs from its AD name (the split-identity
# case this stack is built for) it made the host probe ITSELF as the DC:
# connection refused on 389/88/2049 and `ip route get` showing dev lo, on a
# domain that was perfectly healthy.
- name: Determine the DC to probe (SRV discovery)
  ansible.builtin.set_fact:
    _healthcheck_srv_dc: >-
      {{ (dns_ldap.stdout_lines | default([]) | select('search', 'has SRV record') | list | first | default(''))
         .split() | last | default('', true) | regex_replace('\.$', '') }}

- name: Resolve the DC name every later check will use
  ansible.builtin.set_fact:
    # Explicit variable wins; then SRV discovery; then the literal fallback so
    # the A-record check still reports something meaningful instead of "".
    _healthcheck_dc_fqdn: >-
      {{ (healthcheck_dc_hostname ~ '.' ~ (healthcheck_realm | lower))
         if healthcheck_dc_hostname
         else (_healthcheck_srv_dc if (_healthcheck_srv_dc | trim)
               else ('dc01' ~ '.' ~ (healthcheck_realm | lower))) }}

- name: Resolve the NFS host every later check will use
  ansible.builtin.set_fact:
    _healthcheck_nfs_fqdn: >-
      {{ (healthcheck_nfs_server ~ '.' ~ (healthcheck_realm | lower))
         if healthcheck_nfs_server else (_healthcheck_dc_fqdn | trim) }}

- name: Check A record for DC
  ansible.builtin.command: "host -t A {{ _healthcheck_dc_fqdn | trim }}"
  register: dns_a
  changed_when: false
  failed_when: false

# --- Kerberos check ---
- name: Check Kerberos ticket
  ansible.builtin.command: klist
  register: klist_result
  changed_when: false
  failed_when: false

# --- Service checks ---
- name: Check SSSD service
  ansible.builtin.systemd:
    name: sssd
  register: sssd_status
  failed_when: false

# Winbind is optional (SSSD is the preferred AD client on Linux).
- name: Check winbind service
  ansible.builtin.systemd:
    name: winbind
  register: winbind_status
  failed_when: false

- name: Check autofs service
  ansible.builtin.systemd:
    name: autofs
  register: autofs_status
  failed_when: false

- name: Check NFS server service
  ansible.builtin.systemd:
    name: nfs-server
  register: nfs_server_status
  failed_when: false

# --- NSS resolution check ---
- name: Check domain user lookup
  ansible.builtin.command: "getent passwd {{ healthcheck_test_user }}"
  register: getent_user
  changed_when: false
  failed_when: false

# --- Active NFS mounts ---
- name: Check mounted NFS shares
  ansible.builtin.command: mount -t nfs4 # noqa: command-instead-of-module
  register: nfs_mounts
  changed_when: false
  failed_when: false

# --- Network connectivity to DC ---
# These ports must be open for AD clients to function:
#   88   - Kerberos authentication
#   53   - DNS resolution
# Port 2049 (NFS) is checked against the NFS server (which may be the DC
# or a dedicated storage server).
#
# These three use ignore_errors rather than failed_when: false because the
# summary below tests them with `is failed`.  failed_when: false OVERWRITES the
# result's `failed` flag with false, so `is failed` was never true and every
# port rendered as OPEN even when the port was shut -- exactly the case the
# check exists to catch.  ignore_errors keeps `failed` true and merely stops it
# aborting the play, which is what the summary always assumed.
# (ansible-lint's ignore-errors rule permits this when the task registers.)
- name: Check connectivity to NFS server (port 2049)
  ansible.builtin.wait_for:
    host: "{{ _healthcheck_nfs_fqdn | trim }}"
    port: 2049
    timeout: 5
  ignore_errors: true
  register: nfs_port_2049

- name: Check connectivity to DC (port 88)
  ansible.builtin.wait_for:
    host: "{{ _healthcheck_dc_fqdn | trim }}"
    port: 88
    timeout: 5
  ignore_errors: true
  register: dc_port_88

- name: Check connectivity to DC (port 53)
  ansible.builtin.wait_for:
    host: "{{ _healthcheck_dc_fqdn | trim }}"
    port: 53
    timeout: 5
  ignore_errors: true
  register: dc_port_53

# --- Summary report ---
# Uses Jinja2 conditionals on registered results to produce a PASS/FAIL
# matrix.  The `is not failed` test works with ignore_errors: true tasks.
- name: Healthcheck summary
  ansible.builtin.debug:
    msg: |
      ===== Healthcheck Summary =====
      DNS _ldap._tcp SRV:    {{ 'PASS' if 'has SRV record' in dns_ldap.stdout else 'FAIL' }}
      DNS _kerberos._tcp SRV: {{ 'PASS' if 'has SRV record' in dns_krb.stdout else 'FAIL' }}
      DNS A record (DC):     {{ 'PASS' if 'has address' in dns_a.stdout else 'FAIL' }}  [{{ _healthcheck_dc_fqdn | trim }}]
      Kerberos ticket:       {{ 'PASS' if klist_result.rc == 0 and 'Default principal' in klist_result.stdout else 'NO TICKET' }}
      SSSD service:          {{ 'RUNNING' if sssd_status.status.ActiveState | default('') == 'active' else 'NOT RUNNING' }}
      Winbind service:       {{ 'RUNNING' if winbind_status.status.ActiveState | default('') == 'active' else 'NOT RUNNING' }}
      Autofs service:        {{ 'RUNNING' if autofs_status.status.ActiveState | default('') == 'active' else 'NOT RUNNING' }}
      NFS server:            {{ 'RUNNING' if nfs_server_status.status.ActiveState | default('') == 'active' else 'NOT RUNNING' }}
      User lookup:           {{ 'PASS' if getent_user.rc == 0 else 'FAIL' }}
      NFS port 2049:         {{ 'OPEN' if nfs_port_2049 is not failed else 'CLOSED' }}  [{{ _healthcheck_nfs_fqdn | trim }}]
      DC port 88 (Kerberos): {{ 'OPEN' if dc_port_88 is not failed else 'CLOSED' }}
      DC port 53 (DNS):      {{ 'OPEN' if dc_port_53 is not failed else 'CLOSED' }}
      NFS mounts:            {{ nfs_mounts.stdout_lines | default([]) | length }} active
      ================================

# Every check above is deliberately non-fatal so the whole matrix always
# prints.  Without this final gate, though, `ansible-playbook healthcheck.yml`
# exits 0 no matter what -- a domain with dead DNS, stopped SSSD and closed
# Kerberos ports reported success, and provision.sh's "Health check failed"
# branch was unreachable.  Assert AFTER the summary so the operator still sees
# the full picture, then fail.
#
# Only checks that must hold on EVERY host class are hard.  The rest stay
# informational because their correct value depends on the host's role:
#   Kerberos ticket - root holds no TGT on a member; only the DC does
#   winbind         - masked on the DC by design, absent elsewhere
#   autofs          - masked on NFS storage hosts so it can't shadow the
#                     /data and /home/ad mount roots
#   NFS server      - runs on the NFS host only, not on clients
#   NFS mounts      - autofs mounts on demand, so zero is normal when idle
- name: Fail when a hard healthcheck did not pass
  vars:
    _healthcheck_failures: >-
      {{ (( ['DNS _ldap._tcp SRV'] if 'has SRV record' not in (dns_ldap.stdout | default('')) else [] )
        + ( ['DNS _kerberos._tcp SRV'] if 'has SRV record' not in (dns_krb.stdout | default('')) else [] )
        + ( ['DNS A record for ' ~ (_healthcheck_dc_fqdn | trim)] if 'has address' not in (dns_a.stdout | default('')) else [] )
        + ( ['SSSD service not running'] if (sssd_status.status.ActiveState | default('')) != 'active' else [] )
        + ( ['AD user lookup (' ~ healthcheck_test_user ~ ')'] if getent_user.rc | default(1) != 0 else [] )
        + ( ['NFS port 2049 closed on ' ~ (_healthcheck_nfs_fqdn | trim)]
            if (healthcheck_require_nfs | bool and nfs_port_2049 is failed) else [] )
        + ( ['DC port 88 (Kerberos) closed'] if dc_port_88 is failed else [] )
        + ( ['DC port 53 (DNS) closed'] if dc_port_53 is failed else [] )
      ) }}
  ansible.builtin.assert:
    that:
      - _healthcheck_failures | length == 0
    fail_msg: >-
      Healthcheck FAILED on {{ inventory_hostname }}:
      {{ _healthcheck_failures | join('; ') }}.
      See the summary above for the full matrix.
      Checked realm '{{ healthcheck_realm }}' via DC '{{ _healthcheck_dc_fqdn | trim }}'
      and NFS host '{{ _healthcheck_nfs_fqdn | trim }}' -- if those names are wrong the
      domain is fine and the healthcheck variables are not: set healthcheck_realm /
      healthcheck_dc_hostname / healthcheck_nfs_server (or samba_realm, sssd_realm,
      sssd_dc_hostname, samba_nfs_server, from which they are derived) in group_vars,
      or set healthcheck_require_nfs=false if this host serves no NFS.
    success_msg: "All hard healthcheck checks passed on {{ inventory_hostname }}"
  when: healthcheck_fail_on_error | bool
