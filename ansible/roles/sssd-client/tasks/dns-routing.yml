# dns-routing.yml - Point AD-domain DNS queries at the DC.
#
# This is the ONLY place in the client stack that stores the DC's IP address
# rather than a name, which makes it the single point of failure when the DC
# moves: SSSD discovers the DC via SRV records, but those records live on the
# DC, so a stale address here takes the client's whole AD identity offline.
# Split out of install.yml so playbooks/repair-dc-address.yml can re-point a
# member without re-running package installation and the domain join.
#
# The site DNS/DHCP is externally owned and cannot be modified, so we have
# to override resolution *here*.  The override must be persistent across
# reboot and DHCP renewal -- site DHCP will keep restoring its own
# resolver settings on every lease refresh, so a runtime-only resolvectl
# call would last only until the next reboot.
#
# Persistent: systemd-resolved drop-in under /etc/systemd/resolved.conf.d/.
# Immediate: the resolvectl pair below applies the same override to the
# running stub-resolver without a reload, so realm join / SSSD startup in
# the rest of the play can use the new DNS right away.
---
- name: Ensure systemd-resolved drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: "0755"
    owner: root
    group: root

# systemd-resolved's DNS= takes an IP address, not a name.  The inventory
# may list the DC by FQDN (production hosts.yml does), so resolve the IP
# explicitly: prefer the operator-set sssd_dc_ip, then the DC's gathered
# default IPv4, then ansible_host, and only fall back to the raw inventory
# name (which is only correct when the inventory uses bare IPs, as the
# test harness does).
- name: Resolve DC IP for DNS routing
  ansible.builtin.set_fact:
    _sssd_dc_ip: >-
      {{ sssd_dc_ip
         | default(hostvars[groups['dc'][0]].ansible_facts['default_ipv4'].address
         | default(hostvars[groups['dc'][0]].ansible_host
         | default(groups['dc'][0]))) }}

- name: Assert the resolved DC address is an IPv4 address
  ansible.builtin.assert:
    that:
      - _sssd_dc_ip is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
    fail_msg: >-
      Cannot determine the DC's IP address ({{ _sssd_dc_ip }} is not an IPv4
      address).  Set sssd_dc_ip in group_vars, or ensure facts were gathered
      on the DC in the same run, or set ansible_host to an IP for the DC.

# Both forward and reverse AD lookups must go to the DC:
#   - Forward: <realm> (no leading ~) -- this serves *two* purposes that
#     a pure routing domain (~realm) would not: it is also a *search*
#     domain, so short names from the AD zone (autofs map entries like
#     `storage01`, AD-issued hostnames in keytabs, etc.) get expanded to
#     storage01.<realm> before lookup.  Without the search behaviour
#     autofs's add_host_addrs() fails with "Temporary failure in name
#     resolution" and Kerberos NFS mounts never happen.
#   - Reverse: ~<rev>.in-addr.arpa -- pure routing.  This covers
#     rpc.gssd's reverse resolution of the NFS server IP (the site DNS
#     has no PTR records for the AD subnet), and there is no notion of
#     a "search" suffix for in-addr.arpa, so the ~ prefix is correct.
# Everything outside the AD/reverse zones stays on the site DNS that DHCP
# supplies because we don't claim ~. (the catch-all routing domain).
#
# BOTH subnets' reverse zones are routed: the DC's and this host's own.  They
# are usually the same /24, but a DC that moved subnets (or an off-subnet
# client) otherwise loses reverse resolution for one side -- and this used to
# be derived from the DC's address alone, so a DC move silently un-routed the
# client's own reverse zone.  Duplicates are collapsed by the unique filter.
- name: Compute the reverse zones that must resolve through the DC
  ansible.builtin.set_fact:
    _sssd_reverse_zones: "{{ _sssd_reverse_zones_yaml | from_yaml | unique | list }}"
  vars:
    _sssd_reverse_zones_yaml: |
      {% for _addr in [_sssd_dc_ip, ansible_facts['default_ipv4'].address] %}
      - "{{ _addr.split('.')[2] }}.{{ _addr.split('.')[1] }}.{{ _addr.split('.')[0] }}.in-addr.arpa"
      {% endfor %}

- name: Deploy persistent AD DNS routing drop-in
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/samba-ad.conf
    mode: "0644"
    owner: root
    group: root
    content: |
      # Managed by sssd-client role -- do not edit by hand.
      # Routes AD-domain queries (forward and reverse) to the DC; site DNS
      # still wins for everything else, so this is safe when the site
      # resolver is the one shipped by DHCP.
      [Resolve]
      DNS={{ _sssd_dc_ip }}
      Domains={{ sssd_domain }} {{ _sssd_reverse_zones | map('regex_replace', '^', '~') | join(' ') }}
  register: _sssd_dns_dropin
  notify: Reload systemd-resolved

# Probe whether AD DNS routing is already live in the running resolver, so
# the immediate-effect override below only runs when something actually
# needs fixing.  On re-runs the persistent drop-in (picked up when the
# notified handler restarted systemd-resolved on the run that wrote it)
# already answers this query, keeping the play idempotent.
- name: Check whether the AD domain currently resolves
  ansible.builtin.command: "resolvectl query --type=SRV _ldap._tcp.{{ sssd_domain }}"
  register: _sssd_ad_dns_check
  changed_when: false
  failed_when: false

# Apply the routing to the running stub-resolver without waiting for the
# handler (which only fires at the next flush point -- too late for realm
# discover/join below).  Runs when the drop-in just changed (first run or
# config drift) or the AD zone doesn't resolve (e.g. an earlier run wrote
# the drop-in but died before systemd-resolved restarted).
- name: Set DNS server to DC for domain resolution (immediate effect)
  ansible.builtin.shell: >-
    resolvectl dns {{ ansible_facts['default_ipv4']['interface'] }} {{ _sssd_dc_ip }}
    && resolvectl domain {{ ansible_facts['default_ipv4']['interface'] }} {{ sssd_domain }}
  args:
    executable: /bin/bash
  changed_when: true
  when: (_sssd_dns_dropin is changed) or (_sssd_ad_dns_check.rc != 0)

# Fail here, with the cause named, rather than three tasks later inside
# `realm discover`.  An address that no longer belongs to the DC produces a
# resolver that answers nothing for the AD zone, and every downstream symptom
# (join failure, SSSD offline, dead automounts) points away from the real cause.
- name: Confirm the AD domain resolves through the configured DC address
  ansible.builtin.command: "resolvectl query --type=SRV _ldap._tcp.{{ sssd_domain }}"
  register: _sssd_ad_dns_verify
  changed_when: false
  failed_when: false
  retries: 5
  delay: 2
  until: _sssd_ad_dns_verify.rc == 0

- name: Assert AD DNS routing reaches a live DC
  ansible.builtin.assert:
    that:
      - _sssd_ad_dns_verify.rc == 0
    fail_msg: >-
      _ldap._tcp.{{ sssd_domain }} does not resolve through {{ _sssd_dc_ip }}.
      That address is what /etc/systemd/resolved.conf.d/samba-ad.conf points
      this host at, and it is the only place the DC's address (rather than its
      name) is stored -- if the DC's address changed, this value is stale.
      Confirm the DC's current address, set sssd_dc_ip in
      group_vars/domain_members.yml (and ansible_host for the dc group), then
      re-run playbooks/repair-dc-address.yml.
    success_msg: "AD DNS routing via {{ _sssd_dc_ip }} is live"
